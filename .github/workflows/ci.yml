name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: tier0
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tier0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tier0 -d tier0"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tier0:ci-only-password@localhost:5432/tier0
      LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Integration tests
        run: pytest tests/integration