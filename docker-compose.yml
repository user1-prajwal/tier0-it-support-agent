services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: tier0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tier0
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tier0 -d tier0"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tier0:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tier0
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata: